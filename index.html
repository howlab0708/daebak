<title>참외 영농지침 - 오늘 뭐 해야하나요?</title>
<style>
  :root {
    --green: #2e7d32;
    --green-dark: #1b5e20;
    --amber: #e65100;
    --red: #c62828;
    --blue: #1565c0;
    --ink: #212121;
    --sub: #5f6368;
    --bg: #f5f6f0;

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 18px;
    line-height: 1.5;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }

  header { text-align: center; padding: 12px 0 20px; }
  header h1 { font-size: 26px; margin: 0 0 4px; color: var(--green-dark); }
  header p { margin: 0; color: var(--sub); font-size: 16px; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }

  label { display: block; font-weight: 700; margin-bottom: 8px; }
  select, input[type="date"] {
    width: 100%;
    font-size: 18px;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--ink);
    margin-bottom: 14px;
  }
  select:last-of-type, input:last-of-type { margin-bottom: 0; }

  button.primary {
    width: 100%;
    font-size: 20px;
    font-weight: 700;
    padding: 16px;
    border-radius: 12px;
    border: none;
    background: var(--green);
    color: #fff;
    cursor: pointer;
  }
  button.primary:active { background: var(--green-dark); }
  button.retry {
    margin-top: 12px;
    font-size: 16px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  #status { text-align: center; padding: 24px 0; color: var(--sub); font-size: 17px; display: none; }
  #error { text-align: center; padding: 20px; color: var(--red); display: none; }

  #result { display: none; }

  .weather-summary {
    display: flex; align-items: center; gap: 14px;
    padding: 4px 4px 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .weather-summary .emoji { font-size: 44px; }
  .weather-summary .desc { font-weight: 700; font-size: 19px; }
  .weather-summary .sub { color: var(--sub); font-size: 15px; margin-top: 2px; }
  .metrics { display: flex; gap: 10px; flex-wrap: wrap; }
  .metric { flex: 1; min-width: 90px; background: var(--bg); border-radius: 10px; padding: 8px 10px; text-align: center; }
  .metric .v { font-size: 18px; font-weight: 700; }
  .metric .k { font-size: 13px; color: var(--sub); }

  .flag-card {
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    border: 2px solid var(--border);
  }
  .flag-card.level-severe { border-color: var(--red); background: #fdecea; }
  .flag-card.level-warn { border-color: var(--amber); background: #fff4e5; }
  .flag-card.level-info { border-color: var(--blue); background: #eaf1fb; }
  .flag-card.level-normal { border-color: var(--green); background: #eaf5ea; }

  .flag-title { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .flag-title .emoji { font-size: 26px; }
  .flag-desc { color: var(--sub); font-size: 15px; margin: 0 0 12px; }

  ul.actions { list-style: none; margin: 0; padding: 0; }
  ul.actions li {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0;
    border-top: 1px dashed var(--border);
    font-size: 17px;
  }

  ul.actions input[type="checkbox"] {
    width: 24px; height: 24px; flex: none; margin-top: 2px;
    accent-color: var(--green);
  }
  ul.actions li.checked span { color: var(--sub); text-decoration: line-through; }

  footer { text-align: center; color: var(--sub); font-size: 13px; margin-top: 24px; padding: 0 8px; }
  footer p { margin: 4px 0; }
</style>

function todayStr() {
  const d = new Date();
  const tz = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return tz.toISOString().slice(0, 10);
}
dateInput.value = todayStr();

class UserError extends Error {}

function computeFlags(w) {
  const flags = [];

  if (w.tMax >= 35) flags.push('heat_severe');
  else if (w.tMax >= 33) flags.push('heat');

  if (w.tMin <= -12) flags.push('cold_severe');
  else if (w.tMin <= 3) flags.push('chill');

  if (w.windMax >= 21) flags.push('storm_wind');
  else if (w.windMax >= 14) flags.push('strong_wind');

  if (w.precip >= 150) flags.push('rain_severe');
  else if (w.precip >= 80) flags.push('rain');
  else if (w.precip >= 10) flags.push('rain_moderate');

  if (w.snow >= 5) flags.push('snow_heavy');
  else if (w.snow >= 1) flags.push('snow_light');

  if (flags.length === 0) flags.push('normal');
  return flags;
}

async function fetchWeather(loc, dateStr) {
  const today = new Date(todayStr() + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);

  if (diffDays > 16) {
    throw new UserError('16일 이후의 먼 미래 날씨는 아직 지원하지 않아요. 더 가까운 날짜를 선택해 주세요.');
  }

  const base = diffDays < -92
    ? 'https://archive-api.open-meteo.com/v1/archive'
    : 'https://api.open-meteo.com/v1/forecast';

  const params = new URLSearchParams({
    latitude: loc.lat,
    longitude: loc.lon,
    timezone: 'Asia/Seoul',
    daily: 'weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max,snowfall_sum',
    start_date: dateStr,
    end_date: dateStr,
  });

  let res;
  try {
    res = await fetch(`${base}?${params.toString()}`);
  } catch (e) {
    throw new UserError('인터넷 연결을 확인해주세요.');
  }
  if (!res.ok) throw new UserError('날씨 정보를 불러오지 못했어요. 잠시 후 다시 시도해주세요.');

  const data = await res.json();
  const daily = data.daily;
  if (!daily || !daily.time || !daily.time.length || daily.temperature_2m_max[0] == null) {
    throw new UserError('해당 날짜의 날씨 정보를 아직 찾을 수 없어요.');
  }

  // Open-Meteo 기본 단위: 기온 ℃, 강수량 mm, 적설 cm, 풍속 km/h → m/s로 변환
  return {
    weathercode: daily.weathercode[0],
    tMax: daily.temperature_2m_max[0],
    tMin: daily.temperature_2m_min[0],
    precip: daily.precipitation_sum[0] ?? 0,
    windMax: (daily.windspeed_10m_max?.[0] ?? 0) / 3.6,
    snow: daily.snowfall_sum?.[0] ?? 0,
  };
}

function checklistKey(locId, dateStr, flagId, idx) {
  return `cham-oe:${locId}:${dateStr}:${flagId}:${idx}`;
}

// 일부 브라우저/미리보기 환경(예: data: URL, 시크릿 모드)은 localStorage 접근을 막고 예외를 던짐
function safeGetItem(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function safeSetItem(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

function renderResult(loc, dateStr, w) {
  const [desc, emoji] = WEATHERCODE_MAP[w.weathercode] || ['-', '❓'];
  document.getElementById('wxEmoji').textContent = emoji;
  document.getElementById('wxDesc').textContent = desc;
  document.getElementById('wxDate').textContent = `${loc.name} · ${dateStr}`;
  document.getElementById('mTemp').textContent = `${Math.round(w.tMin)}° / ${Math.round(w.tMax)}°`;
  document.getElementById('mRain').textContent = `${Math.round(w.precip)}mm`;
  document.getElementById('mWind').textContent = `${w.windMax.toFixed(1)}m/s`;

  const flags = computeFlags(w);
  const order = { severe: 0, warn: 1, info: 2, normal: 3 };
  flags.sort((a, b) => order[FLAG_DEFS[a].level] - order[FLAG_DEFS[b].level]);

  flagCardsEl.innerHTML = '';
  flags.forEach(flagId => {
    const def = FLAG_DEFS[flagId];
    const card = document.createElement('div');
    card.className = `flag-card level-${def.level}`;

    const title = document.createElement('div');
    title.className = 'flag-title';
    title.innerHTML = `<span class="emoji">${def.emoji}</span><span>${def.title}</span>`;
    card.appendChild(title);

    const desc = document.createElement('p');
    desc.className = 'flag-desc';
    desc.textContent = def.desc;
    card.appendChild(desc);

    const ul = document.createElement('ul');
    ul.className = 'actions';
    def.actions.forEach((action, idx) => {
      const key = checklistKey(loc.id, dateStr, flagId, idx);
      const li = document.createElement('li');
      const checked = safeGetItem(key) === '1';
      if (checked) li.classList.add('checked');
      li.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}><span>${action}</span>`;
      li.querySelector('input').addEventListener('change', (e) => {
        safeSetItem(key, e.target.checked ? '1' : '0');
        li.classList.toggle('checked', e.target.checked);
      });
      ul.appendChild(li);
    });
    card.appendChild(ul);
    flagCardsEl.appendChild(card);
  });

  resultEl.style.display = 'block';
}

async function runCheck() {
  const loc = LOCATIONS.find(l => l.id === locationSelect.value) || LOCATIONS[0];
  const dateStr = dateInput.value || todayStr();

  statusEl.style.display = 'block';
  errorEl.style.display = 'none';
  resultEl.style.display = 'none';
  checkBtn.disabled = true;

  try {
    const w = await fetchWeather(loc, dateStr);
    renderResult(loc, dateStr, w);
  } catch (e) {
    errorMsgEl.textContent = e instanceof UserError ? e.message : '알 수 없는 오류가 발생했어요. 잠시 후 다시 시도해주세요.';
    errorEl.style.display = 'block';
  } finally {
    statusEl.style.display = 'none';
    checkBtn.disabled = false;
  }
}

checkBtn.addEventListener('click', runCheck);
retryBtn.addEventListener('click', runCheck);
runCheck();
</script>
</body>
</html>
